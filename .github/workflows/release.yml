name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d ' \n' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"

      - name: Install root dependencies
        run: npm ci

      - name: Build runtime and test artifacts
        run: npm run build

      - name: Run Node tests
        run: npm run test:node

      - name: Run installer tests
        run: npm run test:installer:built

      - name: Build release tarball
        shell: bash
        run: |
          set -euo pipefail
          stage="naru-${version}"
          mkdir -p "dist/${stage}"
          cp -R agents skills bin install.sh bootstrap.sh \
                naru-runtime.example.json VERSION LICENSE README.md "dist/${stage}/"
          cp -R .naru-build/tools .naru-build/plugins "dist/${stage}/"
          chmod 755 "dist/${stage}/bin/naru" "dist/${stage}/install.sh" "dist/${stage}/bootstrap.sh"
          tar -czf "dist/naru-${version}.tar.gz" -C dist "${stage}"
          cd dist
          sha256sum "naru-${version}.tar.gz" > "naru-${version}.tar.gz.sha256"
          cat "naru-${version}.tar.gz.sha256"

      - name: Verify the tarball contains only intended assets
        shell: bash
        run: |
          set -euo pipefail
          # A broad `git add` once committed build output; refuse to ship junk.
          if tar -tzf "dist/naru-${version}.tar.gz" \
             | grep -Ev "^naru-${version}/(agents|skills|tools|plugins|bin)/" \
             | grep -Ev "^naru-${version}/(install\.sh|bootstrap\.sh|naru-runtime\.example\.json|VERSION|LICENSE|README\.md)$" \
             | grep -Ev "^naru-${version}/$" \
             | grep -q .; then
            echo "tarball contains unexpected entries:" >&2
            tar -tzf "dist/naru-${version}.tar.gz" \
              | grep -Ev "^naru-${version}/(agents|skills|tools|plugins|bin)/" \
              | grep -Ev "^naru-${version}/(install\.sh|bootstrap\.sh|naru-runtime\.example\.json|VERSION|LICENSE|README\.md)$" \
              | grep -Ev "^naru-${version}/$" >&2
            exit 1
          fi
          echo "tarball contents are clean"

      - name: Verify the tarball installs cleanly
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "dist/naru-${version}.tar.gz" -C "$work"
          root="${work}/naru-${version}"
          test -x "${root}/bin/naru"
          test -f "${root}/install.sh"
          # Preview must not create the target directory.
          HOME="${work}/home" sh "${root}/install.sh" --preview
          if [ -e "${work}/home/.config/opencode" ]; then
            echo "preview mutated the target" >&2
            exit 1
          fi
          # Install through the CLI, which is the path real users take.
          HOME="${work}/home" "${root}/bin/naru" install --apply
          test -f "${work}/home/.config/opencode/agents/naru-orchestrator.md"
          test -f "${work}/home/.config/opencode/tools/naru-doctor.js"
          # Release installs must be pinned copies, never symlinks into
          # ~/.naru/versions, which upgrades supersede and users may prune.
          if find "${work}/home/.config/opencode/agents" -type l | grep -q .; then
            echo "release install left symlinks in the OpenCode config" >&2
            exit 1
          fi
          HOME="${work}/home" "${root}/bin/naru" version

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run after an infrastructure failure, or a retag,
          # must update the existing release rather than collapsing on it.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; replacing its assets."
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/naru-${version}.tar.gz" \
              "dist/naru-${version}.tar.gz.sha256" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/naru-${version}.tar.gz" \
              "dist/naru-${version}.tar.gz.sha256" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
